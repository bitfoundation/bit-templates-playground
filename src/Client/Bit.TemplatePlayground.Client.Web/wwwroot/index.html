<!DOCTYPE html>
<!-- [mirror] host page head tags, stylesheet and script list - keep in sync with:
     - src/Server/Bit.TemplatePlayground.Server.Web/Components/App.razor
     - src/Client/Bit.TemplatePlayground.Client.Maui/wwwroot/index.html
     [mirror] loading indicator markup and css - keep in sync with:
     - src/Client/Bit.TemplatePlayground.Client.Core/Components/Common/LoadingComponent.razor
     - src/Client/Bit.TemplatePlayground.Client.Maui/wwwroot/index.html
     [mirror] bswup progress bar markup and css - keep in sync with:
     - src/Client/Bit.TemplatePlayground.Client.Web/Components/AppBswupProgressBar.razor
-->

<html bit-theme-system bit-theme-persist bit-theme-view-transition
      bit-theme-light="fluent2-light" bit-theme-dark="fluent2-dark">
<head>
    <base href="/">
    <meta charset="utf-8">
    <!-- [mirror] The PWA status bar / browser chrome color. These must equal ThemeColors.cs's PrimaryLightBgColor and
         PrimaryDarkBgColor (the colors the native apps paint their status bar with), so an installed PWA looks like them.
         The OS media queries only cover the first paint: Scripts/theme.ts rewrites BOTH tags on every theme change, so a
         theme pinned against the OS wins as well. Keep in sync with: src/Client/Bit.TemplatePlayground.Client.Core/Styles/ThemeColors.cs -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bit.TemplatePlayground</title>
    <meta name="description" content="The Bit.TemplatePlayground is built with ASP.NET Core, Identity, Web API, EF Core and Blazor.">

    <script>
        // disable auto-zoom of iOS Safari when focusing an input
        (/iPad|iPhone|iPod/.test(navigator.userAgent)) &&
            (document.querySelector('meta[name="viewport"]').content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover');
    </script>

    <link rel="preconnect" href="https://www.google.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <link rel="preconnect" href="https://use-your-api-server-url-here.com">

    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <link href="images/icons/bit-icon-512.png" rel="apple-touch-icon" sizes="512x512" />
    <link href="manifest.json" rel="manifest" />
</head>
<body class="bit-css-clr-bg-pri bit-css-clr-fg-pri bit-blazor-web">
    <link href="_content/Bit.BlazorUI/styles/bit.blazorui.css" rel="stylesheet" />
    <link href="_content/Bit.BlazorUI.Icons/styles/bit.blazorui.icons.css" rel="stylesheet" />
    <link href="_content/Bit.BlazorUI.Assets/styles/bit.blazorui.assets.css" rel="stylesheet" />
    <link href="_content/Bit.BlazorUI.Extras/styles/bit.blazorui.extras.css" rel="stylesheet" />
    <link href="_content/Bit.BlazorUI.Extras/styles/bit.blazorui.fluent2.css" rel="stylesheet" />
    <link href="_content/Bit.TemplatePlayground.Client.Core/styles/app.css" rel="stylesheet" />
    <link href="Bit.TemplatePlayground.Client.Web.styles.css" rel="stylesheet" />
    <style>
        #bit-bswup {
            top: 2px;
            left: 50%;
            display: none;
            position: fixed;
            z-index: 999999999;
            text-align: center;
            transform: translateX(-50%);
            font-family: "Segoe UI", "Segoe UI Web (West European)", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
        }

            #bit-bswup .bswup-container {
                width: 3rem;
                height: 3rem;
                display: block;
                position: relative;
            }

                #bit-bswup .bswup-container circle {
                    fill: none;
                    stroke: #e0e0e0;
                    stroke-width: 0.2rem;
                    transform-origin: 50% 50%;
                    transform: rotate(-90deg);
                }

                    #bit-bswup .bswup-container circle:last-child {
                        stroke: #1b6ec2;
                        transition: stroke-dasharray 0.05s ease-in-out;
                        stroke-dasharray: calc(3.141 * var(--bit-bswup-percent, 0%) * 0.8), 500%;
                    }

            #bit-bswup .bswup-progress-text {
                top: 50%;
                left: 50%;
                font-size: 12px;
                position: absolute;
                text-align: center;
                font-weight: normal;
                transform: translate(-50%, -50%);
            }

                #bit-bswup .bswup-progress-text::after {
                    content: var(--bit-bswup-percent-text, "");
                }
    </style>
    <style>
        /* LoadingComponent.razor's body has been copied here due the lack of razor rending support at this stage */
        .bit-lds-grid div {
            background-color: var(--bit-clr-pri, #1276C6);
        }

        .bit-lds-wrapper-nfs {
            top: 50%;
            left: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }

        .bit-lds-grid {
            width: 80px;
            height: 80px;
            position: relative;
            display: inline-block;
        }

            .bit-lds-grid div {
                width: 16px;
                height: 16px;
                position: absolute;
                border-radius: 50%;
                animation: bit-lds-grid 1.2s linear infinite;
            }

                .bit-lds-grid div:nth-child(1) {
                    top: 8px;
                    left: 8px;
                    animation-delay: 0s;
                }

                .bit-lds-grid div:nth-child(2) {
                    top: 8px;
                    left: 32px;
                    animation-delay: -0.4s;
                }

                .bit-lds-grid div:nth-child(3) {
                    top: 8px;
                    left: 56px;
                    animation-delay: -0.8s;
                }

                .bit-lds-grid div:nth-child(4) {
                    top: 32px;
                    left: 8px;
                    animation-delay: -0.4s;
                }

                .bit-lds-grid div:nth-child(5) {
                    top: 32px;
                    left: 32px;
                    animation-delay: -0.8s;
                }

                .bit-lds-grid div:nth-child(6) {
                    top: 32px;
                    left: 56px;
                    animation-delay: -1.2s;
                }

                .bit-lds-grid div:nth-child(7) {
                    top: 56px;
                    left: 8px;
                    animation-delay: -0.8s;
                }

                .bit-lds-grid div:nth-child(8) {
                    top: 56px;
                    left: 32px;
                    animation-delay: -1.2s;
                }

                .bit-lds-grid div:nth-child(9) {
                    top: 56px;
                    left: 56px;
                    animation-delay: -1.6s;
                }


        @keyframes bit-lds-grid {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
    <div id="app-container">

        <!-- LoadingComponent.razor's body has been copied here due the lack of razor rending support at this stage -->
        <div class="bit-lds-wrapper-nfs">
            <div class="bit-lds-grid">
                <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
            </div>
        </div>

        <div id="bit-bswup">
            <div class="bswup-progress-text"></div>
            <svg class="bswup-container">
                <circle r="40%" cx="50%" cy="50%"></circle>
                <circle r="40%" cx="50%" cy="50%"></circle>
            </svg>
        </div>
    </div>

    <!-- If you don't plan to support older browsers and prefer to use the original `blazor.webassembly.js`, follow the instructions in this link: https://github.com/orgs/bitfoundation/discussions/10238#discussioncomment-12493737 -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="_content/Bit.Bswup/bit-bswup.js" blazorScript="_framework/blazor.webassembly.js" updateInterval="60" updateOnVisibility="true"></script>
    <script src="_content/Bit.Bswup/bit-bswup.progress.js"></script>
    <script>
        // Bit.TemplatePlayground.Client.Core/Scripts/bswup.ts would apply latest version when user is not activly using the app,
        // so the `autoReload` can be set to false to avoid reload during active use.
        const autoReload = false, showLogs = false, showAssets = false, appContainer = '#app-container', hideApp = false, autoHide = true, handler = null;
        BitBswupProgress.start(autoReload, showLogs, showAssets, appContainer, hideApp, autoHide, handler);
    </script>
    <script src="_content/Bit.Butil/bit-butil.js"></script>
    <script src="_content/Bit.BlazorUI/scripts/bit.blazorui.js"></script>
    <script src="_content/Bit.TemplatePlayground.Client.Core/scripts/app.js"></script>
    <script src="_content/Bit.BlazorUI.Extras/scripts/bit.blazorui.extras.js"></script>
</body>
</html>
